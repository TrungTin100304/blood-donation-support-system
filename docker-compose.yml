version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: blood_system
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - blood

  blood:
    build: .
    container_name: blood
    environment:
      MYSQL_URL: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: blood_system
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: admin123
    ports:
      - "8080:8080"
    networks:
      - blood
    depends_on:
      - mysql

networks:
  blood:
    driver: bridge

volumes:
  mysql-data: {}
